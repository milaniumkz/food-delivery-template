# Development/test only. Requires the dependency compose file and a built demo image.
x-app: &app
  image: food-delivery-template:demo
  env_file: ../../.env
  environment: &environment
    NODE_ENV: development
    PAYMENT_PROVIDER: mock
    DATABASE_URL: postgresql://food_local:${POSTGRES_PASSWORD:?Run make bootstrap}@postgres:5432/food_local?connect_timeout=3&socket_timeout=3
    REDIS_URL: redis://redis:6379
    AUTH_KEY: ${AUTH_KEY:?Run make bootstrap}
    BRAND_CONFIG: /app/brands/demo/brand.json
    ADMIN_ORIGIN: http://127.0.0.1:3000
    ADMIN_API_URL: http://api:3001
    MEDIA_DIRECTORY: /app/.local/media
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
services:
  migrate:
    <<: *app
    command: ["node", "../../tools/container-init.mjs"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    environment:
      <<: *environment
      API_HOST: 0.0.0.0
      PORT: 3001
    ports: ["127.0.0.1:3001:3001"]
    volumes: ["media-data:/app/.local/media", "sms-data:/app/.local/sms"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
  admin:
    <<: *app
    working_dir: /app/apps/admin
    command: ["node", "node_modules/next/dist/bin/next", "start", "--hostname", "0.0.0.0", "--port", "3000"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  media-data:
  sms-data:
