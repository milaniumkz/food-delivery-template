name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: food_ci
          POSTGRES_PASSWORD: disposable-ci-database-only
          POSTGRES_DB: food_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U food_ci -d food_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.2.2-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FLUTTER_TOOLCHAIN_DIR: ${{ runner.temp }}/toolchains
      FLUTTER_SDK: ${{ runner.temp }}/toolchains/flutter-3.44.0
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
      PAYMENT_PROVIDER: mock
      DATABASE_URL: postgresql://food_ci:disposable-ci-database-only@127.0.0.1:5432/food_ci?connect_timeout=3&socket_timeout=3
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Generate isolated test authentication key
        run: |
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          fs.appendFileSync(process.env.GITHUB_ENV,'AUTH_KEY='+crypto.randomBytes(32).toString('hex')+String.fromCharCode(10));
          JS
      - run: node tools/install-flutter.mjs
      - run: $FLUTTER_SDK/bin/flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: $FLUTTER_SDK/bin/flutter analyze
        working-directory: apps/mobile
      - run: $FLUTTER_SDK/bin/flutter test
        working-directory: apps/mobile
      - run: pnpm db:generate
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm test:admin
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:recovery
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm openapi && node tools/dart-client.mjs && pnpm exec openapi-typescript packages/contracts/openapi.json -o packages/contracts/client.d.ts
      - run: git diff --exit-code -- packages/contracts/openapi.json packages/contracts/dart packages/contracts/client.d.ts
      - run: node tools/brand.mjs brands/demo/brand.json && node tools/brand.mjs brands/demo-alt/brand.json

      - name: Build two Web brands
        run: |
          node tools/mobile-brand.mjs brands/demo/brand.json --apply
          cd apps/mobile
          $FLUTTER_SDK/bin/flutter build web --no-web-resources-cdn
          cd ../..
          node tools/mobile-brand.mjs brands/demo-alt/brand.json --apply
          cd apps/mobile
          $FLUTTER_SDK/bin/flutter build web --no-web-resources-cdn

      - name: Build Android demo APK
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          node tools/mobile-brand.mjs brands/demo/brand.json --apply
          cd apps/mobile
          $FLUTTER_SDK/bin/flutter build apk --debug
